name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # На сайт уходит только статика. tests/ и worker/ не публикуются.
      - name: Собрать _site
        run: |
          mkdir _site
          cp -r index.html css js _site/
          touch _site/.nojekyll
          ls -R _site

      - name: Проверить, что в сайт не попали ключи
        run: |
          if grep -rEn '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' _site; then
            echo "Похоже на API-ключ в файлах сайта. Деплой остановлен."; exit 1
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
